<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Design: learning map</title>
<meta name="description" content="Bird's-eye map of the system design roadmap: every HLD and LLD phase, the topics inside it, and which explainers are ready.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">

<style>
  .map-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; }
  .map-head .lede { max-width: 640px; }
  .seg-tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .seg-tabs button { font: inherit; display: grid; gap: 1px; padding: 8px 18px; border: 0; border-radius: 10px; background: none; color: var(--fg-soft); cursor: pointer; text-align: left; }
  .seg-tabs button b { font-size: 15px; letter-spacing: .04em; }
  .seg-tabs button span { font-size: 12px; color: var(--muted); }
  .seg-tabs button:hover { background: var(--panel-2); color: var(--fg); }
  .seg-tabs button[aria-pressed="true"] { background: var(--teal-wash); color: var(--fg); box-shadow: inset 0 0 0 1px var(--teal); }

  /* overview rail: every phase at a glance */
  .rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin: 26px 0 8px; }
  .rail a { --acc: var(--teal); display: grid; gap: 6px; padding: 10px 12px 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  .rail a:hover { border-color: var(--acc); transform: translateY(-2px); }
  .rail .top { display: flex; align-items: center; gap: 8px; }
  .rail .n { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); color: var(--ink); background: var(--acc); }
  .rail .nm { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .rail .bar { height: 4px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .rail .bar i { display: block; height: 100%; background: var(--acc); }
  .rail small { font: 11px var(--mono); color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 30px; font: 12px var(--mono); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend b { color: var(--fg); font-weight: 600; }

  /* the route: a spine with one stop per phase */
  .route { position: relative; padding-left: 64px; }
  .route::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 30px; width: 2px; background: linear-gradient(var(--line), var(--line)) ; border-radius: 2px; }
  .ph { --acc: var(--teal); position: relative; margin: 0 0 30px; scroll-margin-top: 20px; }
  .ph .node { position: absolute; left: -64px; top: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--bg); border: 2px solid var(--acc); font: 600 17px var(--mono); color: var(--acc); }
  .ph.has-next .node { box-shadow: 0 0 0 6px color-mix(in srgb, var(--acc) 22%, transparent); }
  .ph-box { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow: hidden; }
  .ph-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 18px 4px; }
  .ph-top h2 { margin: 0; font-size: 21px; font-weight: 600; }
  .ph-top h2 a { color: inherit; text-decoration: none; }
  .ph-top h2 a:hover { color: var(--acc); }
  .ph-top .meta { font: 12px var(--mono); color: var(--muted); }
  .ph-top .count { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  .ph-top .count b { color: var(--acc); font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 205px), 1fr)); gap: 10px; padding: 10px 18px 16px; }
  .card { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px 13px 12px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-top: 3px solid var(--acc); }
  .card h3 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.25; }
  .card p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--fg-soft); }
  .card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
  .card .rng { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--acc) 70%, var(--muted)); background: transparent; display: block; }
  a.dot { background: var(--acc); border-color: var(--acc); transition: transform .12s; }
  a.dot:hover, a.dot:focus-visible { transform: scale(1.35); }
  .dot.next { border-color: var(--fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 25%, transparent); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--fg) 8%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .dot.next { animation: none; } }

  .strip { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 18px; background: var(--code-bg); border-top: 1px solid var(--line); }
  .strip b { font: 600 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
  .strip span { font: 13px var(--mono); color: var(--fg-soft); }

  .finish { position: relative; margin-left: -64px; padding-left: 64px; }
  .finish .node { position: absolute; left: 0; top: 2px; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--yellow); color: var(--ink); font: 600 18px var(--mono); }
  .finish .ph-box { border-style: dashed; }
  .finish p { margin: 0; padding: 4px 18px 16px; color: var(--fg-soft); }

  @media (max-width: 640px) {
    .route { padding-left: 46px; }
    .route::before { left: 15px; }
    .ph .node { left: -46px; width: 32px; height: 32px; font-size: 14px; }
    .finish { margin-left: -46px; padding-left: 46px; }
    .finish .node { width: 32px; height: 32px; font-size: 15px; }
    .ph-top .count { margin-left: 0; width: 100%; }
  }
  @media print {
    .topbar, .seg-tabs, .legend { display: none; }
    .ph { break-inside: avoid; }
  }
</style>
</head>

const ACC=['var(--teal)','var(--blue)','var(--violet)','var(--orange)','var(--cyan)','var(--red)','var(--yellow)','var(--good-text)'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* explainer files by topic number, read from the shared series list (labels look like "H10–12 Proxy" or "L6 Overview") */
function liveFiles(key){
  const out={}, groups=(window.SD&&SD[key.toUpperCase()])||[];
  groups.forEach(g=>g.pages.forEach(([file,label])=>{
    const m=/^[HL](\d+)(?:[–-](\d+))?/.exec(label); if(!m) return;
    const a=+m[1], b=m[2]?+m[2]:a;
    for(let n=a;n<=b;n++) if(!out[n]) out[n]=file;
  }));
  return out;
}

function render(key){
  const T=MAP[key], live=liveFiles(key), names=NAMES[key];
  const all=T.phases.flatMap(p=>p.cards.flatMap(c=>c.ids));
  const total=new Set(all).size, liveN=all.filter(n=>live[n]).length;
  const last=Math.max(0,...Object.keys(live).map(Number));
  const next=all.slice().sort((a,b)=>a-b).find(n=>n>last&&!live[n]);
  document.getElementById('lede').textContent=T.lede;

  document.getElementById('legend').innerHTML=
    `<span><i class="dot" style="--acc:var(--teal);background:var(--teal);border-color:var(--teal)"></i>explainer ready</span>`+
    `<span><i class="dot" style="--acc:var(--teal)"></i>not built yet</span>`+
    (next?`<span><i class="dot next" style="--acc:var(--teal)"></i>next up: <b>${T.pre}${next} ${esc(names[next]||'')}</b></span>`:'')+
    `<span><b>${liveN}</b> / ${total} ${T.unit} have explainers</span>`;

  const stats=T.phases.map(p=>{const ids=p.cards.flatMap(c=>c.ids);return {n:ids.length,l:ids.filter(i=>live[i]).length,has:ids.includes(next)};});

  document.getElementById('rail').innerHTML=T.phases.map((p,i)=>{
    const s=stats[i], pct=Math.round(s.l*100/s.n);
    return `<a href="#${key}-p${i+1}" style="--acc:${ACC[i%ACC.length]}"><div class="top"><span class="n">${i+1}</span><span class="nm">${esc(p.name)}</span></div><div class="bar"><i style="width:${pct}%"></i></div><small>${s.l}/${s.n} ready</small></a>`;
  }).join('');

  const dot=n=>{
    const nm=`${T.pre}${n} · ${names[n]||''}`;
    if(live[n]) return `<a class="dot" href="${T.dir}${esc(live[n])}" title="${esc(nm)} (open explainer)" aria-label="${esc(nm)}, open explainer"></a>`;
    return `<i class="dot${n===next?' next':''}" title="${esc(nm)}${n===next?' (next up)':''}"></i>`;
  };
  const rng=ids=>{const s=ids.slice().sort((a,b)=>a-b);const run=s.every((v,i)=>!i||v===s[i-1]+1);return run&&s.length>1?`${T.pre}${s[0]}–${T.pre}${s[s.length-1]}`:s.map(n=>T.pre+n).join(' ');};

  let html=T.phases.map((p,i)=>{
    const s=stats[i];
    const cards=p.cards.map(c=>`<div class="card"><h3>${esc(c.t)}</h3><p>${esc(c.k)}</p><div class="foot"><div class="dots">${c.ids.map(dot).join('')}</div><span class="rng">${rng(c.ids)}</span></div></div>`).join('');
    return `<section class="ph${s.has?' has-next':''}" id="${key}-p${i+1}" style="--acc:${ACC[i%ACC.length]}">
      <div class="node" aria-hidden="true">${i+1}</div>
      <div class="ph-box">
        <div class="ph-top"><h2><a href="${T.dir}index.html#p${i+1}" title="Open this phase on the roadmap">${esc(p.name)}</a></h2><span class="meta">Phase ${i+1} · ${esc(p.sub)}</span><span class="count"><b>${s.l}</b> / ${s.n} explainers</span></div>
        <div class="cards">${cards}</div>
        <div class="strip"><b>${esc(p.strip[0])}</b><span>${esc(p.strip[1])}</span></div>
      </div></section>`;
  }).join('');
  const f=T.finish;
  html+=`<section class="ph finish" style="--acc:var(--yellow)"><div class="node" aria-hidden="true">★</div><div class="ph-box">
    <div class="ph-top"><h2>Interview day</h2></div><p>${esc(f[2])}</p>
    <div class="strip"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div></div></section>`;
  document.getElementById('route').innerHTML=html;

  document.querySelectorAll('.seg-tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===key));
  document.title=`System Design: ${T.label} learning map`;
}

function pick(){ const h=location.hash.slice(1); return h.startsWith('lld')?'lld':'hld'; }
document.querySelectorAll('.seg-tabs button').forEach(b=>b.addEventListener('click',()=>{
  history.replaceState(null,'','#'+b.dataset.t); render(b.dataset.t); window.scrollTo({top:0});
}));
window.addEventListener('hashchange',()=>{ const k=pick(); if(document.querySelector(`.seg-tabs button[data-t="${k}"]`).getAttribute('aria-pressed')!=='true') render(k); });
render(pick());
</script>
</body>
</html>
